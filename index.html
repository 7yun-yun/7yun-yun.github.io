<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>张逸之的个人主页 - 进阶版</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 40px; color: #333; }
        header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 2px dashed #eee; padding-bottom: 20px;}
        .avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; user-select: none;}
        .name { font-size: 28px; font-weight: bold; margin: 0; }
        .tags { background: #f0f8ff; padding: 4px 10px; border-radius: 15px; font-size: 14px; color: #555; display: inline-block; margin-top: 10px;}
        section { margin-bottom: 30px; }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-left: 4px solid #003366; padding-left: 10px; }
        
        ol, ul { margin: 0; padding-left: 20px; line-height: 1.8; }
        .paper-card { display: flex; justify-content: space-between; align-items: center; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee;}
        .download-btn { background: #003366; color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 14px;}
        
        /* 进度条样式 */
        .skill-bar { margin-bottom: 15px; }
        .skill-bar label { display: inline-block; width: 150px; }
        progress { width: 200px; height: 15px; vertical-align: middle; }
        
        /* 保护区域样式 */
        .protect-area { background: #fff3e0; padding: 10px; border-radius: 5px; border: 1px solid #ffe0b2; user-select: none; }
        
        /* 隐藏内容区样式 */
        #secret-content { margin-top: 15px; padding: 20px; background: #e8f5e9; border-radius: 8px; border: 1px solid #c8e6c9; }
    </style>
</head>
<body>

    <header>
        <!-- 防复制：添加 draggable="false" 和 CSS user-select: none -->
        <img class="avatar" src="avatar.jpg" alt="个人照片" draggable="false">
        <div>
            <h1 class="name">张逸之</h1>
            <ul style="list-style: none; padding: 0; margin: 0; display: flex; gap: 10px;">
                <li class="tags">🚀 数据科学</li>
                <li class="tags">🎨 创意技术</li>
            </ul>
        </div>
    </header>

    <!-- 1. 利用 progress 显示爱好程度 -->
    <section>
        <h2 class="section-title">🌿 我的爱好 (Skills)</h2>
        <div style="background: #fafafa; padding: 15px; border-radius: 8px;">
            <div class="skill-bar">
                <label>算法 &amp; 数据结构</label>
                <progress value="85" max="100"></progress> 85%
            </div>
            <div class="skill-bar">
                <label>独立游戏开发</label>
                <progress value="70" max="100"></progress> 70%
            </div>
            <div class="skill-bar">
                <label>自然语言处理</label>
                <progress value="90" max="100"></progress> 90%
            </div>
            <div class="skill-bar">
                <label>摄影与构图</label>
                <progress value="60" max="100"></progress> 60%
            </div>
        </div>
    </section>

    <!-- 2. 利用 draggable 防止内容被复制 -->
    <section>
        <h2 class="section-title">📄 论文 · 下载 (防复制演示)</h2>
        <div class="paper-card protect-area" onselectstart="return false" oncopy="return false">
            <span draggable="false">📘 基于深度学习的时序预测优化</span>
            <a href="paper.pdf" download class="download-btn">⬇ 下载 PDF</a>
        </div>
        <p style="font-size: 12px; color: #999; margin-top: 8px;">（此区域文字已设置防拖拽、防选中、防复制）</p>
    </section>

    <!-- 3. 利用 hidden 隐藏内容，输入密码后显示 -->
    <section>
        <h2 class="section-title">🔒 私密空间 (密码验证)</h2>
        <p>请输入密码查看隐藏内容 (提示: 密码是 123456):</p>
        <input type="password" id="password-input" placeholder="输入密码...">
        <button onclick="checkPassword()" style="padding: 4px 12px; cursor: pointer;">验证并显示</button>
        
        <!-- 隐藏的内容 -->
        <div id="secret-content" hidden>
            <h3>🎉 恭喜你！密码正确</h3>
            <p>这是我的个人微信号：zhangyizhi_13，欢迎交流学习！</p>
        </div>
    </section>

    <!-- 4. 额外功能：一键回到顶部 + 当前时间 -->
    <footer style="margin-top: 50px; text-align: center; color: #666; font-size: 14px;">
        <p>© 2026 张逸之的个人主页</p>
        <p id="current-time"></p>
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'});" style="padding: 8px 16px; border-radius: 5px; cursor: pointer;">⬆ 一键回到顶部</button>
    </footer>

    <script>
        // 密码验证逻辑
        function checkPassword() {
            var pwd = document.getElementById('password-input').value;
            var hiddenContent = document.getElementById('secret-content');
            if (pwd === '123456') {
                hiddenContent.hidden = false; // 移除 hidden 属性，显示内容
            } else {
                alert('密码错误，请重试！');
            }
        }

        // 额外功能：动态显示当前时间
        function updateTime() {
            var now = new Date();
            document.getElementById('current-time').innerText = "当前访问时间：" + now.toLocaleString();
        }
        updateTime(); // 页面加载时执行一次
    </script>
</body>
</html>
